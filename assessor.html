<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assessor">
<meta name="robots" content="noindex">
<title>Assessor</title>
<style>
:root{
  --bg:#EFEAE2;--bar:#F7F7F7;--ink:#111B21;--ink2:#667781;--line:#D9DDE0;
  --me:#D9FDD3;--bot:#FFFFFF;--acc:#0F766E;--acc-ink:#fff;--chip:#E7F3F1;--chip-ink:#0F5E57;
  --warn:#8A4A0B;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B141A;--bar:#1F2C34;--ink:#E9EDEF;--ink2:#8696A0;--line:#2A3942;
  --me:#005C4B;--bot:#1F2C34;--acc:#2BB3A3;--acc-ink:#062B27;--chip:#163B37;--chip-ink:#9EE6DC;
  --warn:#F3C088;color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--bar);border-bottom:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:16px}
.tt span{font-size:12px;color:var(--ink2)}
.ico{border:0;background:none;color:var(--ink2);padding:6px;font-size:20px;line-height:1}
#msgs{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.m{max-width:84%;padding:7px 10px 6px;border-radius:10px;box-shadow:0 1px .5px rgba(0,0,0,.13);white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);border-top-right-radius:3px}
.bot{align-self:flex-start;background:var(--bot);border-top-left-radius:3px}
.hint{align-self:center;font-size:12.5px;color:var(--ink2);background:var(--bar);padding:6px 10px;border-radius:8px;text-align:center;max-width:90%}
.card-l{font-size:13px;color:var(--ink2);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:2px 9px;font-size:13.5px;font-weight:600}
.chip.q{background:transparent;border:1px dashed var(--ink2);color:var(--ink2);font-weight:500}
.acts{display:flex;gap:6px}
.acts button,.opts button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 12px;border:1px solid var(--line);background:var(--bar);color:var(--ink)}
.acts .ok{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.done{font-size:13px;color:var(--ink2);margin-top:4px}
footer{display:flex;align-items:flex-end;gap:8px;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--bar);border-top:1px solid var(--line)}
#txt{flex:1;resize:none;max-height:120px;min-height:44px;font:inherit;font-size:17px;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bot);color:var(--ink);outline:none}
.send{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.send svg{width:24px;height:24px}
.send.rec{background:#DC2626;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="av">A</div>
    <div class="tt"><b>Assessor</b><span id="sub">rascunho · nada é salvo de verdade</span></div>
    <button class="ico" id="listas" aria-label="Listas" title="Listas">☰</button>
  </header>
  <div id="msgs">
    <div class="hint">Fale ou escreva o que precisa lembrar.<br>Ex.: "reunião com a Marca Z quinta às 15h, é da Susclo"</div>
  </div>
  <footer>
    <textarea id="txt" rows="1" placeholder="Mensagem" enterkeyhint="send"></textarea>
    <button class="send" id="btn" aria-label="Falar"></button>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const msgs = $('msgs'), txt = $('txt'), btn = $('btn');
const ICON_MIC = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>';
const ICON_SEND = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';

const TIPOS = ['Tarefa','Reunião','Ideia','Projeto','Parceiro','Data importante','Melhoria do sistema','Conta a pagar','Compra'];
const EMPRESAS = ['Susy','Susclo','FILETAR','Pessoal'];

// ---------- botão: microfone quando vazio, enviar quando tem texto ----------
function modoBotao(){
  if (ouvindo) { btn.innerHTML = ICON_STOP; btn.classList.add('rec'); btn.setAttribute('aria-label','Parar'); return; }
  btn.classList.remove('rec');
  const tem = txt.value.trim().length > 0;
  btn.innerHTML = tem ? ICON_SEND : ICON_MIC;
  btn.setAttribute('aria-label', tem ? 'Enviar' : 'Falar');
}
txt.addEventListener('input', () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight,120) + 'px'; modoBotao(); });
txt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });

// ---------- voz (reconhecimento do próprio iPhone) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sr = null, ouvindo = false, finalTxt = '';
function falar(){
  if (!SR) { bolha('bot','Este aparelho não oferece o botão de voz. Use o microfone do teclado.'); return; }
  sr = new SR(); sr.lang = 'pt-BR'; sr.interimResults = true; sr.continuous = true; finalTxt = '';
  sr.onstart = () => { ouvindo = true; modoBotao(); txt.placeholder = 'Ouvindo…'; };
  sr.onresult = e => {
    let parcial = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalTxt += e.results[i][0].transcript + ' ';
      else parcial += e.results[i][0].transcript;
    }
    txt.value = (finalTxt + parcial).trim();
  };
  sr.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') bolha('bot','Não consegui ouvir (' + e.error + ').'); };
  sr.onend = () => { ouvindo = false; txt.placeholder = 'Mensagem'; modoBotao(); if (txt.value.trim()) enviar(); };
  try { sr.start(); } catch (err) { ouvindo = false; modoBotao(); }
}
btn.addEventListener('click', () => {
  if (ouvindo) { sr.stop(); return; }
  if (txt.value.trim()) enviar(); else falar();
});

// ---------- conversa ----------
function bolha(quem, conteudo){
  const d = document.createElement('div'); d.className = 'm ' + quem;
  if (typeof conteudo === 'string') d.textContent = conteudo; else d.appendChild(conteudo);
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
}
function enviar(){
  const t = txt.value.trim(); if (!t) return;
  bolha('me', t); txt.value = ''; txt.style.height = 'auto'; modoBotao();
  setTimeout(() => responder(t), 450);
}

// ---------- "entender" de mentira (regras simples, só para o rascunho) ----------
function entender(t){
  const s = t.toLowerCase();
  const tem = (...p) => p.some(x => s.includes(x));
  let tipo = 'Tarefa';
  if (tem('reunião','reuniao','call','meet','encontro','conversar com')) tipo = 'Reunião';
  else if (tem('aniversário','aniversario')) tipo = 'Data importante';
  else if (tem('ideia')) tipo = 'Ideia';
  else if (tem('boleto','pagar','conta de','fatura')) tipo = 'Conta a pagar';
  else if (tem('comprar','compra ')) tipo = 'Compra';
  else if (tem('bug','melhoria','no sistema','travando','botão')) tipo = 'Melhoria do sistema';
  else if (tem('parceria','parceiro','parceira')) tipo = 'Parceiro';
  else if (tem('projeto')) tipo = 'Projeto';
  let empresa = null;
  if (s.includes('susclo')) empresa = 'Susclo'; else if (s.includes('susy')) empresa = 'Susy';
  else if (s.includes('filetar')) empresa = 'FILETAR'; else if (tem('pessoal','minha mãe','meu pai','minha esposa')) empresa = 'Pessoal';
  let quando = null;
  const dia = ['hoje','amanhã','segunda','terça','quarta','quinta','sexta','sábado','domingo'].find(d => s.includes(d));
  const hora = s.match(/(\d{1,2})\s*(h|:\d{2}|horas?)/);
  const tarde = /da tarde|da noite/.test(s);
  if (dia || hora) {
    let h = hora ? parseInt(hora[1],10) : null;
    if (h !== null && tarde && h < 12) h += 12;
    quando = [dia, h !== null ? h + 'h' : null].filter(Boolean).join(' ');
  }
  const nome = (t.match(/(?:com (?:a |o )?)([A-ZÀ-Ú][\wÀ-ú]*(?: [A-ZÀ-Ú][\wÀ-ú]*)*)/) || [])[1] || null;
  return { tipo, empresa, quando, nome };
}

function responder(t){
  const r = entender(t);
  const box = document.createElement('div');
  const l = document.createElement('div'); l.className = 'card-l'; l.textContent = 'Entendi:'; box.appendChild(l);
  const chips = document.createElement('div'); chips.className = 'chips'; box.appendChild(chips);
  const desenhar = () => {
    chips.innerHTML = '';
    const add = (v, fallback) => { const c = document.createElement('span'); c.className = 'chip' + (v ? '' : ' q'); c.textContent = v || fallback; chips.appendChild(c); };
    add(r.tipo); if (r.nome) add(r.nome); if (r.quando) add(r.quando); add(r.empresa, 'empresa?');
  };
  desenhar();
  const acts = document.createElement('div'); acts.className = 'acts';
  const ok = document.createElement('button'); ok.className = 'ok'; ok.textContent = '✔ Confirmar';
  const fix = document.createElement('button'); fix.textContent = '✏️ Corrigir';
  acts.append(ok, fix); box.appendChild(acts);
  const opts = document.createElement('div'); opts.className = 'opts'; opts.hidden = true; box.appendChild(opts);

  fix.onclick = () => {
    opts.hidden = !opts.hidden; if (opts.hidden) return;
    opts.innerHTML = '';
    const grupo = (lista, campo) => lista.forEach(v => {
      const b = document.createElement('button'); b.textContent = v;
      b.onclick = () => { r[campo] = v; desenhar(); };
      opts.appendChild(b);
    });
    grupo(TIPOS, 'tipo'); grupo(EMPRESAS, 'empresa');
    msgs.scrollTop = msgs.scrollHeight;
  };
  ok.onclick = () => {
    acts.remove(); opts.remove();
    const d = document.createElement('div'); d.className = 'done';
    d.textContent = '✔ Guardado' + (r.tipo === 'Reunião' ? ' · na versão real, também vai para o Google Agenda' : '') + ' (rascunho)';
    box.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  };
  bolha('bot', box);
}

$('listas').onclick = () => bolha('bot','Aqui vão ficar as listas (origens, ações e histórico). Ainda não existe no rascunho.');
modoBotao();
</script>
</body>
</html>
